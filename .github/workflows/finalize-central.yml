name: Finalize Central deployments

on:
  workflow_dispatch:
    inputs:
      deployment_name_filter:
        description: Unique substring shared by the intended Central deployment names
        required: true
        type: string
      expected_count:
        description: Exact number of deployments that must match before publication
        required: true
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: central-finalize-${{ inputs.deployment_name_filter }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Validate and publish exact Central deployments
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Verify release credentials
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          test -n "${CENTRAL_USERNAME}"
          test -n "${CENTRAL_PASSWORD}"

      - name: Publish validated deployments and await Maven Central
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_NAME_FILTER: ${{ inputs.deployment_name_filter }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          if [[ ! "${DEPLOYMENT_NAME_FILTER}" =~ ^[A-Za-z0-9._-]{3,120}$ ]]; then
            echo "Deployment filter must be a 3-120 character identifier." >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_COUNT}" =~ ^[0-9]+$ ]] ||
             (( EXPECTED_COUNT < 1 || EXPECTED_COUNT > 100 )); then
            echo "Expected deployment count must be between 1 and 100." >&2
            exit 1
          fi

          authorization="$(
            printf '%s:%s' "${CENTRAL_USERNAME}" "${CENTRAL_PASSWORD}" |
              base64 |
              tr -d '\n'
          )"
          api='https://central.sonatype.com/api/v1/publisher'

          list_deployments() {
            curl --fail-with-body --silent --show-error \
              --get \
              --header "Authorization: Bearer ${authorization}" \
              --data-urlencode "deploymentName=${DEPLOYMENT_NAME_FILTER}" \
              --data 'size=100' \
              --data 'sortField=createTimestamp' \
              --data 'sortDirection=desc' \
              "${api}/deployments"
          }

          matching_deployments() {
            jq --arg filter "${DEPLOYMENT_NAME_FILTER}" \
              '[.deployments[] | select(.deploymentName | contains($filter))]'
          }

          report_failed_deployments() {
            local deployments_json="$1"
            while IFS= read -r deployment_id; do
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${authorization}" \
                "${api}/status?id=${deployment_id}" |
                jq -r '"Failed deployment: \(.deploymentName) [\(.deploymentId)]\nValidation errors: \((.errors // {}) | tojson)"'
            done < <(
              jq -r '.[] | select(.deploymentState == "FAILED") | .deploymentId' \
                <<< "${deployments_json}"
            )
          }

          validation_deadline=$((SECONDS + 3600))
          while true; do
            deployments="$(list_deployments | matching_deployments)"
            count="$(jq 'length' <<< "${deployments}")"
            if (( count > EXPECTED_COUNT )); then
              echo "Refusing to publish: ${count} deployments matched; expected ${EXPECTED_COUNT}." >&2
              exit 1
            fi
            if jq -e 'any(.deploymentState == "FAILED")' <<< "${deployments}" >/dev/null; then
              report_failed_deployments "${deployments}" >&2
              exit 1
            fi
            incomplete="$(
              jq '[.[] | select(
                .deploymentState != "VALIDATED" and
                .deploymentState != "PUBLISHING" and
                .deploymentState != "PUBLISHED"
              )] | length' <<< "${deployments}"
            )"
            if (( count == EXPECTED_COUNT && incomplete == 0 )); then
              break
            fi
            if (( SECONDS >= validation_deadline )); then
              echo "Timed out waiting for ${EXPECTED_COUNT} validated deployments; found ${count}." >&2
              jq -r '.[] | "\(.deploymentName): \(.deploymentState)"' <<< "${deployments}" >&2
              exit 1
            fi
            sleep 10
          done

          while IFS= read -r deployment_id; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${authorization}" \
              "${api}/deployment/${deployment_id}"
          done < <(
            jq -r '.[] | select(.deploymentState == "VALIDATED") | .deploymentId' \
              <<< "${deployments}"
          )

          publication_deadline=$((SECONDS + 3600))
          while true; do
            deployments="$(list_deployments | matching_deployments)"
            count="$(jq 'length' <<< "${deployments}")"
            published="$(jq '[.[] | select(.deploymentState == "PUBLISHED")] | length' <<< "${deployments}")"
            if jq -e 'any(.deploymentState == "FAILED")' <<< "${deployments}" >/dev/null; then
              report_failed_deployments "${deployments}" >&2
              exit 1
            fi
            if (( count == EXPECTED_COUNT && published == EXPECTED_COUNT )); then
              break
            fi
            if (( SECONDS >= publication_deadline )); then
              echo "Timed out waiting for publication: ${published}/${EXPECTED_COUNT} published." >&2
              jq -r '.[] | "\(.deploymentName): \(.deploymentState)"' <<< "${deployments}" >&2
              exit 1
            fi
            sleep 10
          done

          {
            echo '### Maven Central publication complete'
            echo
            echo "Published ${published} deployment(s) matching \`${DEPLOYMENT_NAME_FILTER}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  advertise:
    name: Open a PR advertising the published release
    needs: finalize
    # Library releases only. finalize-central also publishes model markers, whose deployment names
    # are modeljars-<model-id>-<run-id>; those do not change what the site advertises.
    if: needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Decide whether this release changes the advertised coordinate
        id: release
        shell: bash
        env:
          DEPLOYMENT_NAME_FILTER: ${{ inputs.deployment_name_filter }}
        run: |
          if [[ "${DEPLOYMENT_NAME_FILTER}" =~ ^modeljars-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
            echo "library=true" >> "${GITHUB_OUTPUT}"
          else
            echo "library=false" >> "${GITHUB_OUTPUT}"
            echo "Not a library release (\`${DEPLOYMENT_NAME_FILTER}\`); the site advertises no model markers." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Checkout
        if: steps.release.outputs.library == 'true'
        uses: actions/checkout@v5

      - name: Set up Node
        if: steps.release.outputs.library == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Wait for repo1 to serve the release
        if: steps.release.outputs.library == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # The finalize above waits on Central's own publisher API, which flips before repo1 has
          # synced: 0.1.75 served its jar while its POM was still 404 and maven-metadata still named
          # 0.1.73, for roughly twenty minutes. verify-site-version.mjs reads repo1, so opening the
          # PR before the sync lands would produce a branch that cannot pass its own gate.
          metadata=https://repo1.maven.org/maven2/org/modeljars/modeljars/maven-metadata.xml
          deadline=$(( SECONDS + 2400 ))
          while :; do
            release="$(curl -fsSL --max-time 30 "${metadata}" 2>/dev/null |
              grep -oE '<release>[^<]+' | sed 's/<release>//' || true)"
            pom="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "https://repo1.maven.org/maven2/org/modeljars/modeljars/${VERSION}/modeljars-${VERSION}.pom")"
            if [[ "${release}" == "${VERSION}" && "${pom}" == "200" ]]; then
              echo "repo1 serves ${VERSION}."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              # Not a failure of the release, which is published. The bump is simply not openable
              # yet, and is left to a re-run rather than opened against a coordinate repo1 cannot
              # resolve.
              {
                echo "### Site bump deferred"
                echo
                echo "repo1 had not synced ${VERSION} within 40 minutes (release=\`${release}\`,"
                echo "POM \`${pom}\`). Re-run this workflow, or bump the site by hand with"
                echo "\`node tools/advertise-release.mjs site ${VERSION}\`."
              } >> "${GITHUB_STEP_SUMMARY}"
              echo "SYNC_TIMED_OUT=1" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 30
          done

      - name: Rewrite the carriers and open the PR
        if: steps.release.outputs.library == 'true' && env.SYNC_TIMED_OUT != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm ci
          node tools/advertise-release.mjs site "${VERSION}" | tee /tmp/advertise.log
          if git diff --quiet -- site; then
            echo "The site already advertises ${VERSION}; nothing to open." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          branch="site/advertise-${VERSION}"
          if gh pr list --head "${branch}" --state all --json number --jq 'length' | grep -qv '^0$'; then
            echo "A PR for \`${branch}\` already exists." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Evidence in the body, because a PR opened with GITHUB_TOKEN does not trigger this
          # repository's workflows: a reviewer would otherwise see a version bump with no checks.
          node tools/verify-site-version.mjs site | tee /tmp/gate.log
          npm test 2>&1 | tail -5 | tee /tmp/tests.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add site
          printf '%s\n\n%s\n' \
            "Advertise ${VERSION} in the site's dependency snippets" \
            "Opened by finalize-central once repo1 served ${VERSION}. The coordinate is a literal so that a published release can be withheld from the page, and so the same commit always renders the same version. This is the bump that literal costs." \
            > /tmp/commit.txt
          git commit -F /tmp/commit.txt
          git push --set-upstream origin "${branch}"
          {
            echo "Opened by \`finalize-central\` after repo1 served **${VERSION}**."
            echo
            echo '```'
            cat /tmp/advertise.log /tmp/gate.log
            echo '```'
            echo
            echo "\`npm test\`:"
            echo '```'
            cat /tmp/tests.log
            echo '```'
            echo
            echo "Checks are absent by design: a PR opened with \`GITHUB_TOKEN\` does not trigger"
            echo "this repository's workflows, so the gate and test output above is the evidence."
            echo "Merging re-runs \`pages\`, which is what makes the new coordinate live."
          } > /tmp/body.md
          gh pr create --base main --head "${branch}" \
            --title "Advertise ${VERSION} in the site's dependency snippets" \
            --body-file /tmp/body.md
