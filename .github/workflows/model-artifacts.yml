name: Model artifacts

on:
  pull_request:
    paths:
      - catalog/models.json
      - catalog/qualifications.json
      - catalog/embedding-qualifications.json
      - catalog/tool-qualifications.json
      - catalog/reranking-qualifications.json
      - catalog/performance-profiles.json
      - tools/model-publications.mjs
      - tools/model-publications.test.mjs
      - tools/qualification-smoke-gate.mjs
      - tools/qualification-smoke-gate.test.mjs
      - tools/independent-model-publication.test.mjs
      - tools/plan-model-publications.mjs
      - build.gradle.kts
      - gradle.properties
      - package.json
      - package-lock.json
      - settings.gradle.kts
      - .github/workflows/model-artifacts.yml
  push:
    branches:
      - main
    paths:
      - catalog/models.json
      - catalog/qualifications.json
      - catalog/embedding-qualifications.json
      - catalog/tool-qualifications.json
      - catalog/reranking-qualifications.json
      - catalog/performance-profiles.json
      - tools/model-publications.mjs
      - tools/model-publications.test.mjs
      - tools/qualification-smoke-gate.mjs
      - tools/qualification-smoke-gate.test.mjs
      - tools/independent-model-publication.test.mjs
      - tools/plan-model-publications.mjs
      - build.gradle.kts
      - gradle.properties
      - package.json
      - package-lock.json
      - settings.gradle.kts
      - .github/workflows/model-artifacts.yml
  workflow_dispatch:
    inputs:
      target:
        description: Verification or explicit publication target.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - github-packages
          - maven-central
      model_ids:
        description: Comma-separated catalog model IDs, or all.
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: model-artifacts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan immutable model publications
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      has_publications: ${{ steps.plan.outputs.has_publications }}
      matrix: ${{ steps.plan.outputs.matrix }}
      removed: ${{ steps.plan.outputs.removed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install catalog tooling
        run: npm ci

      - name: Resolve model publication plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_MODEL_IDS: ${{ inputs.model_ids }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            node tools/plan-model-publications.mjs \
              --current catalog/models.json \
              --qualifications catalog/qualifications.json \
              --embedding-qualifications catalog/embedding-qualifications.json \
              --tool-qualifications catalog/tool-qualifications.json \
              --reranking-qualifications catalog/reranking-qualifications.json \
              --ids "${REQUESTED_MODEL_IDS}" \
              --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi

          comparison="${BASE_SHA}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            comparison="${BEFORE_SHA}"
          fi
          previous_catalog="${RUNNER_TEMP}/models-before.json"
          previous_profiles="${RUNNER_TEMP}/performance-profiles-before.json"
          previous_qualifications="${RUNNER_TEMP}/qualifications-before.json"
          previous_embedding="${RUNNER_TEMP}/embedding-qualifications-before.json"
          previous_tool="${RUNNER_TEMP}/tool-qualifications-before.json"
          previous_reranking="${RUNNER_TEMP}/reranking-qualifications-before.json"
          if [[ -z "${comparison}" || "${comparison}" =~ ^0+$ ]] || \
              ! git cat-file -e "${comparison}^{commit}"; then
            printf '%s\n' '{"schemaVersion":2,"models":[]}' > "${previous_catalog}"
            printf '%s\n' '{"schemaVersion":1,"profiles":[]}' > "${previous_profiles}"
            printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_qualifications}"
            printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_embedding}"
            printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_tool}"
            printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_reranking}"
          else
            git show "${comparison}:catalog/models.json" > "${previous_catalog}"
            git show "${comparison}:catalog/performance-profiles.json" > "${previous_profiles}"
            if ! git show "${comparison}:catalog/qualifications.json" > "${previous_qualifications}"; then
              printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_qualifications}"
            fi
            if ! git show "${comparison}:catalog/embedding-qualifications.json" > "${previous_embedding}"; then
              printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_embedding}"
            fi
            if ! git show "${comparison}:catalog/tool-qualifications.json" > "${previous_tool}"; then
              printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_tool}"
            fi
            if ! git show "${comparison}:catalog/reranking-qualifications.json" > "${previous_reranking}"; then
              printf '%s\n' '{"schemaVersion":1,"entries":[]}' > "${previous_reranking}"
            fi
          fi
          node tools/qualification-smoke-gate.mjs \
            --previous "${previous_qualifications}" \
            --current catalog/qualifications.json \
            --catalog catalog/models.json \
            --verify-remote
          node tools/plan-model-publications.mjs \
            --previous "${previous_catalog}" \
            --current catalog/models.json \
            --qualifications catalog/qualifications.json \
            --previous-qualifications "${previous_qualifications}" \
            --embedding-qualifications catalog/embedding-qualifications.json \
            --previous-embedding-qualifications "${previous_embedding}" \
            --tool-qualifications catalog/tool-qualifications.json \
            --previous-tool-qualifications "${previous_tool}" \
            --reranking-qualifications catalog/reranking-qualifications.json \
            --previous-reranking-qualifications "${previous_reranking}" \
            --previous-profiles "${previous_profiles}" \
            --current-profiles catalog/performance-profiles.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Summarize plan
        env:
          COUNT: ${{ steps.plan.outputs.count }}
          REMOVED: ${{ steps.plan.outputs.removed }}
        run: |
          {
            echo "### Model artifact plan"
            echo
            echo "Independent publications: ${COUNT}"
            echo
            echo "Catalog removals: \`${REMOVED}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  verify:
    name: Verify selected model artifacts
    needs: plan
    if: needs.plan.outputs.has_publications == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install catalog tooling
        run: npm ci

      - name: Test publication policy and generated artifacts
        run: |
          npm test
          ./gradlew --no-daemon spotlessCheck test verifyCatalog verifyMarkerPublicationIndependence

  github-packages:
    name: Publish ${{ matrix.id }} to GitHub Packages
    needs: [plan, verify]
    if: >-
      needs.plan.outputs.has_publications == 'true' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'github-packages')
      )
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build independent model JAR
        run: ./gradlew --no-daemon "${{ matrix.jarTask }}"

      - name: Verify an existing immutable GitHub Package
        id: existing_package
        shell: bash
        env:
          COORDINATE: ${{ matrix.coordinate }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_JAR: ${{ matrix.jarPath }}
        run: |
          set -euo pipefail
          IFS=: read -r group_id artifact_id version extra <<< "${COORDINATE}"
          if [[ -z "${group_id}" || -z "${artifact_id}" || -z "${version}" || -n "${extra:-}" ]]; then
            echo "::error::Invalid immutable marker coordinate: ${COORDINATE}"
            exit 1
          fi
          if [[ ! -f "${LOCAL_JAR}" ]]; then
            echo "::error::Built marker JAR is missing: ${LOCAL_JAR}"
            exit 1
          fi

          group_path="${group_id//./\/}"
          file_name="${artifact_id}-${version}.jar"
          package_url="https://maven.pkg.github.com/modeljars/modeljars/${group_path}/${artifact_id}/${version}/${file_name}"
          existing_jar="${RUNNER_TEMP}/existing-${file_name}"
          if ! status="$(curl --location --silent --show-error \
            --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            --output "${existing_jar}" \
            --write-out '%{http_code}' \
            "${package_url}")"; then
            echo "::error::Could not query GitHub Packages for ${COORDINATE}"
            exit 1
          fi

          case "${status}" in
            200)
              local_jar="$(realpath "${LOCAL_JAR}")"
              local_entries="${RUNNER_TEMP}/local-marker-entries"
              existing_entries="${RUNNER_TEMP}/existing-marker-entries"
              mkdir -p "${local_entries}" "${existing_entries}"
              (
                cd "${local_entries}"
                jar --extract --file "${local_jar}"
              )
              (
                cd "${existing_entries}"
                jar --extract --file "${existing_jar}"
              )
              if ! diff --recursive --brief "${local_entries}" "${existing_entries}"; then
                echo "::error::Existing immutable package does not match ${COORDINATE}"
                sha256sum "${LOCAL_JAR}" "${existing_jar}"
                exit 1
              fi
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              echo "Reusing content-identical GitHub Package ${COORDINATE}." >> "${GITHUB_STEP_SUMMARY}"
              ;;
            404)
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::GitHub Packages returned HTTP ${status} for ${COORDINATE}"
              exit 1
              ;;
          esac

      - name: Attest model JAR
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ matrix.jarPath }}

      - name: Publish model JAR and Maven metadata
        if: steps.existing_package.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon "${{ matrix.githubTask }}"

  maven-central:
    name: Stage ${{ matrix.id }} for Maven Central
    needs: [plan, verify]
    if: >-
      needs.plan.outputs.has_publications == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'maven-central'
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Verify release credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "${CENTRAL_USERNAME}"
          test -n "${CENTRAL_PASSWORD}"
          test -n "${GPG_PRIVATE_KEY}"
          test -n "${GPG_PASSPHRASE}"

      - name: Build signed model release bundle
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          ./gradlew --no-daemon
          markerReleaseBundleZip
          -Prelease=true
          "-PmodeljarsMarkerIds=${{ matrix.id }}"

      - name: Attest Central bundle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: build/release/modeljars-marker-bundle.zip

      - name: Retain verified Central bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modeljars-central-${{ matrix.id }}-${{ github.sha }}
          path: build/release/modeljars-marker-bundle.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload USER_MANAGED deployment
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MODEL_ID: ${{ matrix.id }}
        run: |
          authorization="$(printf '%s:%s' "${CENTRAL_USERNAME}" "${CENTRAL_PASSWORD}" | base64 | tr -d '\n')"
          deployment_id="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${authorization}" \
              --form "bundle=@build/release/modeljars-marker-bundle.zip;type=application/octet-stream" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=modeljars-${MODEL_ID}-${GITHUB_RUN_ID}&publishingType=USER_MANAGED"
          )"
          if ! printf '%s' "${deployment_id}" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "Central returned an invalid deployment ID." >&2
            exit 1
          fi
          {
            echo "### Maven Central model deployment"
            echo
            echo "Uploaded \`${MODEL_ID}\` as USER_MANAGED deployment \`${deployment_id}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
