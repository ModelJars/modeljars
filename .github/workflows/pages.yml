name: pages

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - catalog/**
      - media/icons/**
      - build.gradle.kts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Test browser source
        run: npm ci && npm test

      - name: Generate searchable catalog
        run: ./gradlew --no-daemon generateSite

      - name: Version browser assets atomically
        run: node tools/site-asset-versioning.mjs build/site "$GITHUB_SHA"

      - name: Smoke-test the rendered catalog
        run: node tools/site-smoke.mjs build/site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
