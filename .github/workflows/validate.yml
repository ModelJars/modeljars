name: validate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      reasoning_audit:
        description: Run the default-answer audit for gated MobileMoE using the configured HF credential.
        type: boolean
        default: false
      models_smoke_revision:
        description: Optional immutable Models harness revision for the gated MobileMoE default smoke.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gated-reasoning-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.reasoning_audit
    name: Gated MobileMoE reasoning display
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Install JBang
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"
      - name: Exercise the released model with default answer display
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JAVA_TOOL_OPTIONS: -Xmx8g -Dmodels.native.kernels.threads=8 -Dmodels.purejava.maxContextLength=2048 -Dmodeljars.demo.maxTokens=512
        run: |
          mkdir -p reasoning-results
          jbang tools/reasoning-audit/ReasoningCatalogProbe.java \
            facebook_mobilemoe_s_qat_int4_g32 reasoning-results/mobilemoe.json \
            > reasoning-results/mobilemoe.log 2>&1
          python3 - <<'PYTHON'
          import json
          report = json.load(open('reasoning-results/mobilemoe.json'))
          assert report.get('complete') and not report.get('failure'), report.get('failure')
          assert len(report['cases']) == 3
          assert all(c['hasFinalAnswer'] and not c['reasoningMarkerLeak'] for c in report['cases'])
          assert all(c['stopReason'] in ('EOS', 'STOP_SEQUENCE') for c in report['cases'])
          PYTHON
      - name: Retain live reasoning audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobilemoe-reasoning-display
          path: reasoning-results/
          retention-days: 30

  gated-released-rag-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.models_smoke_revision != ''
    name: Released MobileMoE default RAG smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Validate immutable harness revision
        env:
          MODELS_REVISION: ${{ inputs.models_smoke_revision }}
        run: '[[ "$MODELS_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          repository: integrallis/models
          ref: ${{ inputs.models_smoke_revision }}
          path: models-smoke-source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Build the installer and measurement harness
        run: |
          ./gradlew --no-daemon :modeljars-cli:installDist
          MODELS_VERSION=$(sed -n 's/^modelsVersion=//p' gradle.properties)
          VECTORS_VERSION=$(sed -n 's/^vectorsVersion=//p' gradle.properties)
          (cd models-smoke-source && ./gradlew --no-daemon -Pversion="$MODELS_VERSION" :models-rag-bench:installDist)
          python3 models-smoke-source/benchmark-results/2026-10-11-bonsai-production/prepare-released-payload.py \
            --models-version "$MODELS_VERSION" --vectors-version "$VECTORS_VERSION" \
            --output "$RUNNER_TEMP/released-models"
      - name: Install verified gated weights and measure released defaults
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 tools/released-rag-smoke.py --models-repo models-smoke-source \
            --payload "$RUNNER_TEMP/released-models" \
            --model-id facebook_mobilemoe_s_qat_int4_g32 --output "$RUNNER_TEMP/mobilemoe-smoke"
      - name: Exercise the source MobileMoE fixture suite with the installed gated weights
        env:
          FIXTURE_REPORT_ROOT: ${{ runner.temp }}/mobilemoe-smoke
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MOBILE_FIXTURE=$(python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["FIXTURE_REPORT_ROOT"])/"installation.json").read_text())["path"])')
          python3 -m venv "$RUNNER_TEMP/mobilemoe-oracle-venv"
          "$RUNNER_TEMP/mobilemoe-oracle-venv/bin/pip" install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/mobilemoe-oracle-venv/bin/pip" install transformers==4.57.6 tokenizers==0.22.2 safetensors==0.7.0 numpy==2.2.6
          "$RUNNER_TEMP/mobilemoe-oracle-venv/bin/python" tools/prepare-mobilemoe-oracle.py --directory "$MOBILE_FIXTURE"
          cp "$MOBILE_FIXTURE/oracle-provenance.json" "$FIXTURE_REPORT_ROOT/oracle-provenance.json"
          (cd models-smoke-source && ./gradlew --no-daemon \
            :backend-java:mobileMoeHuggingFaceIntegrationTest \
            "-Dmodels.fixtures.mobileMoeQatDirectory=$MOBILE_FIXTURE")
          python3 - <<'PYTHON'
          import pathlib, xml.etree.ElementTree as E
          reports = pathlib.Path('models-smoke-source/backend-java/build/test-results/mobileMoeHuggingFaceIntegrationTest')
          suites = [E.parse(p).getroot() for p in reports.glob('TEST-*.xml')]
          counts = {k: sum(int(s.get(k, 0)) for s in suites) for k in ['tests', 'failures', 'errors', 'skipped']}
          print('Pinned source fixture suite:', counts)
          assert counts['tests'] >= 7 and not any(counts[k] for k in ['failures', 'errors', 'skipped']), counts
          PYTHON
      - name: Retain reports and exact inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: released-mobilemoe-default-smoke
          path: |
            ${{ runner.temp }}/mobilemoe-smoke/*.json
            ${{ runner.temp }}/mobilemoe-smoke/*.log
            ${{ runner.temp }}/mobilemoe-smoke/*.txt
            ${{ runner.temp }}/mobilemoe-smoke/gate.py
            ${{ runner.temp }}/released-models/classpath.json
            ${{ runner.temp }}/released-models/provenance.json
            models-smoke-source/backend-java/build/test-results/mobileMoeHuggingFaceIntegrationTest/*.xml
          retention-days: 30

  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether remote catalog verification is required
        id: remote-catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          required=false
          comparison=""
          case "${EVENT_NAME}" in
            schedule|workflow_dispatch)
              required=true
              ;;
            pull_request)
              comparison="${BASE_SHA}"
              ;;
            push)
              comparison="${BEFORE_SHA}"
              ;;
            *)
              required=true
              ;;
          esac

          # `required` now gates only the pinned Hugging Face metadata check, which authenticates
          # against gated repositories and is therefore not run on every pull request.
          if [[ "${required}" != "true" ]]; then
            if [[ -z "${comparison}" || "${comparison}" =~ ^0+$ ]] || \
                ! git cat-file -e "${comparison}^{commit}"; then
              required=true
            elif ! git diff --quiet "${comparison}" "${GITHUB_SHA}" -- catalog/models.json; then
              required=true
            fi
          fi

          {
            echo "required=${required}"
            echo "comparison=${comparison}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install catalog tooling
        run: npm ci

      - name: Test runtime support rejection cases
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Test dependency policy rejection cases
        run: |
          python3 scripts/test-dependency-policy.py
          python3 scripts/test-published-consumers.py

      - name: Test catalog tooling and site modules
        run: npm test

      # Compile every released-catalog probe against what Central actually serves, without pulling
      # any weights. MEASURED 2026-10-23: the text-generation probe shipped with three invented API
      # calls, so it never compiled and that arm of the end-to-end harness silently never ran. The
      # only signal was a failed post-deployment run, which is far too late and far too expensive
      # for a compile error. `jbang build` resolves and runs javac in seconds.
      - name: Compile released-catalog probes against Central
        run: |
          set -euo pipefail
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          export PATH="$HOME/.jbang/bin:$PATH"
          version="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ -z "$version" ]; then
            echo "no release tag yet; nothing published to compile against" >&2
            exit 0
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/org/modeljars/modeljars/$version/modeljars-$version.jar")"
          if [ "$code" != "200" ]; then
            echo "modeljars $version is tagged but not on Central (HTTP $code); skipping" >&2
            exit 0
          fi
          node tools/released-catalog-e2e.mjs --modeljars-version "$version" --compile-only

      - name: Verify generated performance profiles match pinned evidence
        run: npm run catalog:profiles:check

      - name: Verify qualified composition evidence
        run: npm run catalog:verify-compositions

      - name: Verify qualified component evidence
        run: npm run catalog:verify-components

      - name: Verify non-text modality claims against the artifacts
        run: npm run catalog:modality

      - name: Verify qualification manifests advance generatedAt
        env:
          COMPARISON: ${{ steps.remote-catalog.outputs.comparison }}
        run: |
          if [[ -z "${COMPARISON}" || "${COMPARISON}" =~ ^0+$ ]] || \
              ! git cat-file -e "${COMPARISON}^{commit}"; then
            echo "No base revision to compare qualification manifests against"
          else
            node tools/qualification-generation-gate.mjs --base "${COMPARISON}"
          fi

      - name: Verify runtime support from a clean build
        run: ./gradlew --no-daemon clean verifyQualificationRuntimeCompatibility

      - name: Exercise embedding and composition loaders with real weights
        run: >
          ./gradlew --no-daemon
          :modeljars:lfm25EmbeddingIntegrationTest
          :modeljars:embeddingGemma2IntegrationTest
          :modeljars-composite-granite-answerability:qualifiedIntegrationTest

      - name: Validate build
        run: >
          ./gradlew --no-daemon
          spotlessCheck test assemble verifyCatalog verifyLaunchQualifications verifyJvmRuntimePublication
          verifyQualificationRuntimeCompatibility verifyReleaseTrain verifyPublishedConsumerGraph
          verifyQwenChatToolsPublication verifyGraniteAnswerabilityPublication generateSite

      # npm test renders the catalog too, but it runs BEFORE this build and has to assemble its own
      # join from catalog/*.json, which reproduces the fields and not the enrichment generateSite
      # applies: a raw rag entry carries no useCaseTier, the served catalog.json carries
      # useCaseTier=GUARDED_RAG. MEASURED 2026-10-23: 104 of 107 entries differed that way, so a
      # defect reachable only through an enriched field passed npm test and reached production.
      # This renders the exact bytes the browser fetches, which is only possible after generateSite.
      - name: Render every served catalog entry
        run: node tools/rendered-catalog-check.mjs

      - name: Retain dependency and consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-dependency-consumers
          path: |
            build/reports/release-dependencies/
            build/reports/runtime-support/
            build/published-consumers/
          retention-days: 30

      - name: Exercise the qualified mxbai bundle through ModelJars
        run: >
          ./gradlew --no-daemon
          -PmxbaiRerankerLive=true
          :modeljars:mxbaiRerankerIntegrationTest

      - name: Verify pinned Hugging Face metadata
        if: steps.remote-catalog.outputs.required == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./gradlew --no-daemon verifyRemoteCatalogMetadata

      # Every model, every time -- never only the ones this change touched.
      #
      # This ran in `changed` mode against the merge base, which checks a new or edited entry and
      # nothing else. publish.yml enriches all of them unconditionally, so the two gates disagreed
      # and a catalog entry carrying hand-written dimensions passed its own pull request and failed
      # on main. MEASURED 2026-10-23: three entries reached main that way -- laya_q8_0,
      # minicpm5_2b_q4_k_m and vibethinker_1_5b_q4_k_m -- each with a parameterCount that was the
      # non-embedding total, understating the published figure by 11-15%. One of them was already
      # published, so correcting it cost a new marker coordinate.
      #
      # The whole catalog takes about 40 seconds of HTTP range requests, which is cheaper than
      # discovering the drift after a release.
      - name: Verify exact GGUF dimensions
        run: npm run catalog:enrich -- --concurrency=3

      - name: Publish JVM Runtime smoke-test artifacts to Maven Local
        run: >
          ./gradlew --no-daemon
          :modeljars-core:publishMavenPublicationToMavenLocal
          :modeljars-catalog:publishMavenPublicationToMavenLocal
          :modeljars-catalog:publishMarkerQwen306bQ40PublicationToMavenLocal
          :modeljars:publishMavenPublicationToMavenLocal
          :modeljars-composite-qwen3-chat-tools:publishMavenPublicationToMavenLocal

      - name: Consume JVM Runtime from Maven Local
        run: ./gradlew --no-daemon -p smoke-tests/jvm-runtime-consumer run

      - name: Validate catalog source
        run: jq . catalog/models.json >/dev/null
